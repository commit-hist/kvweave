name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Linux torch wheels bundle the CUDA runtime, while hosted runners start
      # with little free space. Reclaim the preinstalled toolchains this job
      # never uses before Pants builds its hermetic environments.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift
          df -h /
          available_kb="$(df --output=avail / | tail -n 1)"
          minimum_kb="$((25 * 1024 * 1024))"
          if (( available_kb < minimum_kb )); then
            echo "::error::Runner has less than 25 GiB free after cleanup"
            exit 1
          fi

      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Check formatting and lint
        run: mise run lint

      - name: Run offline tests
        run: mise run test

      - name: Build wheel and source distribution
        run: mise run package

      - name: Smoke-test built wheel metadata
        run: |
          mise exec -- python -m venv "$RUNNER_TEMP/kvweave-wheel-check"
          "$RUNNER_TEMP/kvweave-wheel-check/bin/python" -m pip install \
            --no-deps dist/kvweave-*.whl
          "$RUNNER_TEMP/kvweave-wheel-check/bin/python" - <<'PY'
          import importlib.util
          import tomllib
          from importlib.metadata import version

          with open("pyproject.toml", "rb") as project_file:
              expected_version = tomllib.load(project_file)["project"]["version"]

          assert version("kvweave") == expected_version
          assert importlib.util.find_spec("kvweave") is not None
          PY

      - name: Report final runner disk usage
        if: always()
        run: df -h /
