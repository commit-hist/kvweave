name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Linux torch wheels bundle the CUDA runtime and Pants materializes them
      # across several PEX files, which exhausts the runner's ~14 GB of free
      # space. Reclaim the preinstalled toolchains this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - name: Install locked toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Check formatting and lint
        run: mise run lint

      - name: Run offline tests
        run: mise run test

      - name: Build wheel and source distribution
        run: mise run package
