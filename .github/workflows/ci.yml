name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Linux torch wheels bundle the CUDA runtime, while hosted runners start
      # with little free space. Reclaim the preinstalled toolchains this job
      # never uses before Pants builds its hermetic environments.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift
          df -h /
          available_kb="$(df --output=avail / | tail -n 1)"
          minimum_kb="$((25 * 1024 * 1024))"
          if (( available_kb < minimum_kb )); then
            echo "::error::Runner has less than 25 GiB free after cleanup"
            exit 1
          fi

      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Check formatting and lint
        run: mise run lint

      - name: Run offline tests
        run: mise run test

      - name: Build wheel and source distribution
        run: mise run package

      - name: Cache installed-wheel dependency downloads
        # Cache downloads only, never an installed environment or the local wheel.
        # Version changes invalidate this cache through the lockfile and workflow.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-wheel-pip-${{ hashFiles('mise.lock', '3rdparty/python/default.lock', '.github/workflows/ci.yml') }}

      - name: Check installed wheel metadata and retrieval
        run: |
          mise exec -- python -m venv "$RUNNER_TEMP/kvweave-wheel-check"
          # A CPU-only wheel avoids a second CUDA runtime installation.
          "$RUNNER_TEMP/kvweave-wheel-check/bin/python" -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --constraint 3rdparty/python/constraints.txt torch
          "$RUNNER_TEMP/kvweave-wheel-check/bin/python" -m pip install \
            --no-deps dist/kvweave-*.whl packaging==26.3
          "$RUNNER_TEMP/kvweave-wheel-check/bin/python" -I \
            scripts/check_wheel.py --project pyproject.toml

      - name: Report final runner disk usage
        if: always()
        run: df -h /
