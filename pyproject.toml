[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kvdb"
version = "0.0.1"
description = "Experimental indexing and retrieval infrastructure for LLM KV caches"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Keyur Gabani"},
]
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
model-experiment = [
    "transformers==5.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not model_download'"
testpaths = ["tests"]
markers = [
    "model_download: opt-in validation that downloads a pinned external model",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
