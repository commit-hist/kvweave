[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kvweave"
version = "0.0.1"
description = "Experimental research infrastructure for shared KV-cache retrieval and indexing in transformer inference."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Keyur Gabani"},
]
keywords = ["attention", "kv-cache", "llm", "retrieval", "transformers"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
model-experiment = [
    "transformers==5.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not model_download'"
testpaths = ["tests"]
markers = [
    "model_download: opt-in validation that downloads a pinned external model",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
