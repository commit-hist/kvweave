[tool_config]
locked = true

[tools]
python = "3.11"
scie-pants = { version = "0.13.2", bin = "pants" }

[tasks.fmt]
description = "Format Python and BUILD files with Ruff through Pants"
run = "pants fmt ::"

[tasks.lint]
description = "Check Ruff formatting and lint rules through Pants"
run = "pants lint ::"

[tasks.test]
description = "Run the complete test suite through Pants"
run = "pants test ::"

[tasks.package]
description = "Build the KVDB wheel and source distribution through Pants"
run = "pants package //:dist"

[tasks.check]
description = "Run all required code checks"
run = [
    { task = "lint" },
    { task = "test" },
]

[tasks."bench:brute-force"]
description = "Run the brute-force reference benchmark through Pants"
run = "pants run benchmarks/scripts:brute_force --"

[tasks."bench:quest"]
description = "Run the Quest reference benchmark through Pants"
run = "pants run benchmarks/scripts:quest_reference --"

[tasks."bench:pq"]
description = "Run the PQ reference benchmark through Pants"
run = "pants run benchmarks/scripts:pq_reference --"

[tasks."bench:real-model"]
description = "Run the opt-in Pythia real-activation reference benchmark"
run = "pants run benchmarks/scripts:real_model_reference --"

[tasks."bench:phase3a-replication"]
description = "Run the multi-text, multi-position Pythia Phase 3A replication"
run = "pants run benchmarks/scripts:phase3a_replication --"

[tasks."bench:phase3a-policy-development-features"]
description = "Collect locked pre-retrieval features on development fixtures"
run = "pants run benchmarks/scripts:phase3a_policy_features -- --fixture-split development"

[tasks."bench:phase3a-policy-freeze"]
description = "Select and freeze the policy-feasibility model on development data"
run = "pants run benchmarks/scripts:phase3a_policy_feasibility -- freeze"

[tasks."bench:phase3a-policy-heldout-features"]
description = "Collect locked pre-retrieval features on held-out fixtures once"
run = "pants run benchmarks/scripts:phase3a_policy_features -- --fixture-split held_out"

[tasks."bench:phase3a-policy-heldout-outcomes"]
description = "Run the frozen four-candidate matrix on held-out fixtures once"
run = "pants run benchmarks/scripts:phase3a_replication -- --fixture-split held_out --output benchmarks/results/pythia-410m-phase3a-policy-held-out-outcomes.json"

[tasks."bench:phase3a-policy-evaluate"]
description = "Apply the development-frozen model to locked held-out outcomes"
run = "pants run benchmarks/scripts:phase3a_policy_feasibility -- evaluate"

[tasks."bench:phase3b-decode"]
description = "Run pinned Pythia stateful autoregressive decode validation"
run = "pants run benchmarks/scripts:phase3b_decode --"
