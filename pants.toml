[GLOBAL]
pants_version = "2.33.0"
backend_packages = [
    "pants.backend.build_files.fmt.ruff",
    "pants.backend.experimental.python.lint.ruff.check",
    "pants.backend.experimental.python.lint.ruff.format",
    "pants.backend.python",
]

[python]
enable_resolves = true
interpreter_constraints = ["CPython==3.11.*"]

[python.resolves]
python-default = "3rdparty/python/default.lock"

[python.resolves_to_constraints_file]
python-default = "3rdparty/python/constraints.txt"

[pex]
# Tests use several dependency subsets from the shared resolve. Symlinking
# their PEX venvs avoids materializing a separate copy of large wheels such as
# torch for every distinct subset.
venv_use_symlinks = true

[ruff]
config = "pyproject.toml"
