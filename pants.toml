[GLOBAL]
pants_version = "2.33.0"
backend_packages = [
    "pants.backend.build_files.fmt.ruff",
    "pants.backend.experimental.python.lint.ruff.check",
    "pants.backend.experimental.python.lint.ruff.format",
    "pants.backend.python",
]

[python]
enable_resolves = true
interpreter_constraints = ["CPython==3.11.*"]

[python.resolves]
python-default = "3rdparty/python/default.lock"

# KVWeave is a CPU-only reference implementation. On Linux, torch pulls a large
# set of bundled CUDA runtime packages that are never loaded here and that
# exhaust CI runner disk while PEXes are materialized. They carry Linux-only
# markers, so excluding them is a no-op on macOS and leaves the torch version
# itself unchanged.
[python.resolves_to_excludes]
python-default = [
    "nvidia-cublas",
    "nvidia-cuda-cupti",
    "nvidia-cuda-nvrtc",
    "nvidia-cuda-runtime",
    "nvidia-cudnn-cu13",
    "nvidia-cufft",
    "nvidia-cufile",
    "nvidia-curand",
    "nvidia-cusolver",
    "nvidia-cusparse",
    "nvidia-cusparselt-cu13",
    "nvidia-nccl-cu13",
    "nvidia-nvjitlink",
    "nvidia-nvshmem-cu13",
    "nvidia-nvtx",
    "triton",
]

[ruff]
config = "pyproject.toml"
